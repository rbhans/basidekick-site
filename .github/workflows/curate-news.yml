name: Curate BAS News (Manual Fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curate-bas-news
  cancel-in-progress: false

jobs:
  curate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate runtime configuration
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error title=Missing runtime config::Set NEXT_PUBLIC_SUPABASE_URL as a repository or environment variable/secret before running the curator."
            exit 1
          fi

          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error title=Missing runtime config::Set SUPABASE_SERVICE_ROLE_KEY or SUPABASE_SERVICE_KEY as a repository or environment secret before running the curator."
            exit 1
          fi

      - name: Run curator
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          NEWS_LOOKBACK_DAYS: "3"
          NEWS_RETIRE_AFTER_DAYS: "7"
          NEWS_DEDUPE_DAYS: "30"
          NEWS_PER_FEED_LIMIT: "8"
        run: pnpm curate:news
