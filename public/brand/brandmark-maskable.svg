<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BASidekick maskable icon">
  <!-- PWA maskable icon — 512×512 with crimson bleed to all edges so any
       OS-applied mask (circle, squircle, rounded square) still shows the
       crimson card. BrandMark glyphs sit inside the central 40% safe zone
       (≈205px × 115px at this scale).
       Spec: https://web.dev/maskable-icon -->
  <rect width="512" height="512" fill="#d11a36"/>

  <!-- Centered BrandMark scaled into the safe zone -->
  <g transform="translate(118, 199)">
    <svg viewBox="0 0 32 18" width="276" height="155" overflow="visible">
      <rect x="3" y="6" width="6" height="6" rx="1" fill="#fafaf8"/>
      <path d="M10 9 H17 M15 6.5 L17.5 9 L15 11.5" stroke="#fafaf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="19.5" y="2.5" width="10" height="13" rx="1.5" fill="none" stroke="#fafaf8" stroke-width="1.6"/>
    </svg>
  </g>
</svg>
