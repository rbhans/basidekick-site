<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="BASidekick">
  <!-- 1:1 social card — dark surface, crimson accent, single-line wordmark -->
  <rect width="1080" height="1080" fill="#0a0a0a"/>
  <rect x="40" y="40" width="1000" height="1000" rx="16" fill="none" stroke="rgba(250,250,248,0.08)" stroke-width="2"/>

  <!-- Section label -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4">
    <circle cx="100" cy="116" r="5" fill="#d11a36"/>
    <text x="118" y="122" fill="rgba(250,250,248,0.66)">INDEPENDENT BAS TOOLKIT</text>
  </g>

  <!-- BrandMark icon, large -->
  <g transform="translate(372, 380)">
    <svg viewBox="0 0 32 18" width="336" height="189" overflow="visible">
      <rect x="0" y="0" width="32" height="18" rx="2" fill="#d11a36"/>
      <rect x="3.25" y="6.2" width="5.6" height="5.6" rx="0.9" fill="#fafaf8"/>
      <path d="M10.1 9 H16.7 M14.45 6.8 L16.75 9 L14.45 11.2" stroke="#fafaf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="19.8" y="2.75" width="9.2" height="12.5" rx="1.3" fill="none" stroke="#fafaf8" stroke-width="1.5"/>
    </svg>
  </g>

  <!-- Wordmark -->
  <text x="540" y="720" text-anchor="middle"
        font-family="Archivo Black, Archivo, Helvetica Neue, Arial, sans-serif"
        font-weight="900"
        font-size="92"
        letter-spacing="-2"
        fill="#fafaf8">BASidekick</text>

  <!-- Footer rail -->
  <line x1="80" y1="960" x2="1000" y2="960" stroke="rgba(250,250,248,0.08)" stroke-width="1"/>
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="22" letter-spacing="4">
    <text x="80" y="1000" fill="#d11a36">BASIDEKICK.COM</text>
    <text x="1000" y="1000" fill="rgba(250,250,248,0.44)" text-anchor="end">EST. TUCSON</text>
  </g>
</svg>
