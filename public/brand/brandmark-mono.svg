<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 18" width="32" height="18" role="img" aria-label="BASidekick mark (monochrome)">
  <!-- BrandMark monochrome — single near-black fill for print, fax, email,
       and any CMYK pipeline where crimson reproduces poorly. Same geometry
       as brandmark.svg; surface inverts to ink, cutouts become outlined
       strokes in ink so they read on any paper color. -->
  <rect width="32" height="18" rx="2" fill="#0a0a0a"/>
  <rect x="3.25" y="6.2" width="5.6" height="5.6" rx="0.9" fill="none" stroke="#fafaf8" stroke-width="1.35"/>
  <path d="M10.1 9 H16.7 M14.45 6.8 L16.75 9 L14.45 11.2" stroke="#fafaf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="19.8" y="2.75" width="9.2" height="12.5" rx="1.3" fill="none" stroke="#fafaf8" stroke-width="1.5"/>
</svg>
