<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="BASidekick">
  <!-- Light surface: cream background, crimson mark + near-black wordmark -->
  <rect width="400" height="400" fill="#fafaf8" rx="32"/>
  <rect x="12" y="12" width="376" height="376" rx="24" fill="none" stroke="rgba(10,10,10,0.08)" stroke-width="2"/>

  <!-- BrandMark icon, scaled up and centered -->
  <g transform="translate(80, 130)">
    <svg viewBox="0 0 32 18" width="240" height="135" overflow="visible">
      <rect x="0" y="0" width="32" height="18" rx="2" fill="#d11a36"/>
      <rect x="3.25" y="6.2" width="5.6" height="5.6" rx="0.9" fill="#fafaf8"/>
      <path d="M10.1 9 H16.7 M14.45 6.8 L16.75 9 L14.45 11.2" stroke="#fafaf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="19.8" y="2.75" width="9.2" height="12.5" rx="1.3" fill="none" stroke="#fafaf8" stroke-width="1.5"/>
    </svg>
  </g>

  <!-- Wordmark below -->
  <text x="200" y="320" text-anchor="middle"
        font-family="Archivo Black, Archivo, Helvetica Neue, Arial, sans-serif"
        font-weight="900"
        font-size="36"
        letter-spacing="-0.5"
        fill="#0a0a0a">BASidekick</text>
</svg>
