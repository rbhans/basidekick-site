<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80" role="img" aria-label="BASidekick">
  <rect width="480" height="80" fill="#0a0a0a" rx="4"/>

  <!-- BrandMark icon -->
  <g transform="translate(20, 30)">
    <svg viewBox="0 0 32 18" width="64" height="36" overflow="visible">
      <rect x="0" y="0" width="32" height="18" rx="2" fill="#d11a36"/>
      <rect x="3" y="6" width="6" height="6" rx="1" fill="#fafaf8"/>
      <path d="M10 9 H17 M15 6.5 L17.5 9 L15 11.5" stroke="#fafaf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="19.5" y="2.5" width="10" height="13" rx="1.5" fill="none" stroke="#fafaf8" stroke-width="1.6"/>
    </svg>
  </g>

  <!-- Wordmark — cream on near-black -->
  <text x="100" y="56"
        font-family="Archivo Black, Archivo, Helvetica Neue, Arial, sans-serif"
        font-weight="900"
        font-size="38"
        letter-spacing="-0.5"
        fill="#fafaf8">BASidekick</text>
</svg>
