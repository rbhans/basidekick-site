<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80" role="img" aria-label="BASidekick">
  <!-- Wordmark monochrome — single near-black fill for print/email pipelines
       where crimson reproduces poorly. Mark inverts to ink with outlined
       cutouts; wordmark stays in ink. Geometry matches wordmark-light.svg. -->
  <g transform="translate(20, 30)">
    <svg viewBox="0 0 32 18" width="64" height="36" overflow="visible">
      <rect x="0" y="0" width="32" height="18" rx="2" fill="#0a0a0a"/>
      <rect x="3.25" y="6.2" width="5.6" height="5.6" rx="0.9" fill="none" stroke="#fafaf8" stroke-width="1.35"/>
      <path d="M10.1 9 H16.7 M14.45 6.8 L16.75 9 L14.45 11.2" stroke="#fafaf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="19.8" y="2.75" width="9.2" height="12.5" rx="1.3" fill="none" stroke="#fafaf8" stroke-width="1.5"/>
    </svg>
  </g>
  <text x="100" y="56"
        font-family="Archivo Black, Archivo, Helvetica Neue, Arial, sans-serif"
        font-weight="900"
        font-size="38"
        letter-spacing="-0.5"
        fill="#0a0a0a">BASidekick</text>
</svg>
