<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="BASidekick">
  <!-- 1500x500 X/Twitter header. Avatar circle at left ~120,375 — content centered horizontally -->
  <rect width="1500" height="500" fill="#0a0a0a"/>

  <!-- Logo glyph: centered above wordmark -->
  <g transform="translate(702, 165)">
    <svg viewBox="0 0 32 18" width="96" height="54" overflow="visible">
      <rect x="0" y="0" width="32" height="18" rx="2" fill="#d11a36"/>
      <rect x="3" y="6" width="6" height="6" rx="1" fill="#fafaf8"/>
      <path d="M10 9 H17 M15 6.5 L17.5 9 L15 11.5" stroke="#fafaf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="19.5" y="2.5" width="10" height="13" rx="1.5" fill="none" stroke="#fafaf8" stroke-width="1.6"/>
    </svg>
  </g>

  <!-- Wordmark: centered -->
  <text x="750" y="285" text-anchor="middle"
        font-family="Archivo Black, Archivo, Helvetica Neue, Arial, sans-serif"
        font-weight="900"
        font-size="64"
        letter-spacing="-1.5"
        fill="#fafaf8">BASidekick</text>

  <!-- Tagline: centered -->
  <text x="750" y="325" text-anchor="middle"
        font-family="JetBrains Mono, ui-monospace, Menlo, monospace"
        font-size="18"
        letter-spacing="4"
        fill="rgba(250,250,248,0.66)">INDEPENDENT BAS TOOLKIT</text>

  <!-- Right edge — section markers in mono -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="14" letter-spacing="3">
    <text x="1420" y="460" fill="rgba(250,250,248,0.44)" text-anchor="end">LEARN · COMMUNITY · BUILD</text>
  </g>
</svg>
