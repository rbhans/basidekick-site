<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="BASidekick — BAS info, community, and resources">
  <!-- Mirrors the runtime OG image — cream surface, crimson accent -->
  <rect width="1200" height="630" fill="#fafaf8"/>

  <!-- Top status strip -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2">
    <circle cx="90" cy="86" r="4" fill="#d11a36"/>
    <text x="106" y="90" fill="rgba(10,10,10,0.44)" text-transform="uppercase">SYS NOMINAL</text>
    <text x="246" y="90" fill="rgba(10,10,10,0.22)">·</text>
    <text x="266" y="90" fill="rgba(10,10,10,0.44)">INDEPENDENT BAS TOOLKIT</text>
  </g>

  <!-- Section number + label -->
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="20" letter-spacing="3">
    <text x="80" y="280" fill="#d11a36">.01</text>
    <text x="125" y="280" fill="rgba(10,10,10,0.44)">BASIDEKICK</text>
  </g>

  <!-- Headline -->
  <g font-family="Archivo Black, Archivo, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="62" letter-spacing="-1.5">
    <text x="80" y="370" fill="#0a0a0a">BAS info, community, and</text>
    <text x="80" y="442" fill="#0a0a0a">resources — <tspan fill="#d11a36" font-style="italic">built by a working</tspan></text>
    <text x="80" y="514" fill="#d11a36" font-style="italic">engineer<tspan fill="#0a0a0a" font-style="normal">, independent of any vendor.</tspan></text>
  </g>

  <!-- Footer rule + meta -->
  <line x1="80" y1="558" x2="1120" y2="558" stroke="rgba(10,10,10,0.08)" stroke-width="1"/>
  <g font-family="JetBrains Mono, ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2">
    <text x="80" y="594" fill="#d11a36">BASIDEKICK</text>
    <text x="208" y="594" fill="rgba(10,10,10,0.22)">·</text>
    <text x="232" y="594" fill="#0a0a0a">BASIDEKICK.COM</text>
    <text x="1120" y="594" fill="rgba(10,10,10,0.44)" text-anchor="end">ATLAS · POINTSTACK · WIKI · NEWS · SOURCE</text>
  </g>
</svg>
