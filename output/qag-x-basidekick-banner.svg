<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="t d" font-family="'Archivo Black', Archivo, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">BASidekick × QA Graphics split banner</title>
  <desc id="d">A wide dark banner split on a diagonal: near-black BASidekick side with crimson mark on the left, official QAG-blue side with the white QA Graphics logo and its signature multi-color bar on the right, divided by a crimson seam.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#f5f5f5" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="navy" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#155284"/>
      <stop offset="0.5" stop-color="#0e406a"/>
      <stop offset="1" stop-color="#0a3056"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- base + brand fields -->
  <rect width="1600" height="400" fill="#0a0a0a"/>
  <polygon points="940,0 1600,0 1600,400 690,400" fill="url(#navy)"/>
  <polygon points="0,0 940,0 690,400 0,400" fill="url(#grid)"/>

  <!-- diagonal crimson seam -->
  <line x1="940" y1="0" x2="690" y2="400" stroke="#d11a36" stroke-width="10" opacity="0.45" filter="url(#glow)"/>
  <line x1="940" y1="0" x2="690" y2="400" stroke="#d11a36" stroke-width="3"/>

  <!-- corner registration ticks -->
  <g stroke-width="2" fill="none">
    <path d="M24 42 V24 H42" stroke="#f5f5f5" stroke-opacity="0.18"/>
    <path d="M24 358 V376 H42" stroke="#f5f5f5" stroke-opacity="0.18"/>
    <path d="M1576 42 V24 H1558" stroke="#ffffff" stroke-opacity="0.30"/>
    <path d="M1576 358 V376 H1558" stroke="#ffffff" stroke-opacity="0.30"/>
  </g>

  <!-- LEFT: BASidekick lockup -->
  <g transform="translate(298,114) scale(4.0)">
    <rect width="32" height="18" rx="2" fill="#d11a36"/>
    <rect x="3" y="6" width="6" height="6" rx="1" fill="#fafaf8"/>
    <path d="M10 9 H17 M15 6.5 L17.5 9 L15 11.5" stroke="#fafaf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="19.5" y="2.5" width="10" height="13" rx="1.5" fill="none" stroke="#fafaf8" stroke-width="1.6"/>
  </g>
  <text x="300" y="250" font-size="62" font-weight="900" letter-spacing="-1" fill="#fafaf8">BASidekick</text>
  <path d="M302,281 L302,290 L310,285.5 Z" fill="#d11a36"/>
  <text x="320" y="290" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="16.5" letter-spacing="3.4" fill="#fafaf8" fill-opacity="0.62">INDEPENDENT BAS TOOLKIT</text>

